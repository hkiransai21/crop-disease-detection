name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-and-test:
    name: Backend Lint, Type-Check & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install torch torchvision timm imagehash

      - name: Lint with Ruff
        run: |
          ruff check backend ml

      - name: Type-check with Mypy
        run: |
          mypy backend/app ml/src/transforms.py ml/src/datasets.py --ignore-missing-imports

      - name: Validate Multilingual Data & Numeric Parity
        run: |
          PYTHONPATH=. pytest backend/tests/test_i18n.py -v

      - name: Run Pytest Suite with Coverage
        run: |
          PYTHONPATH=. pytest backend/tests ml/tests --cov=backend/app --cov-report=term --cov-report=xml --cov-fail-under=80

  frontend-quality-and-test:
    name: Frontend Lint & Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check Frontend
        working-directory: frontend
        run: npm run type-check || npx tsc --noEmit

      - name: Run Vitest Suite
        working-directory: frontend
        run: npm run test:run

  docker-build:
    name: Validate Docker Multi-stage Builds
    runs-on: ubuntu-latest
    needs: [backend-quality-and-test, frontend-quality-and-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: crop-disease-backend:ci-test

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: crop-disease-frontend:ci-test
