services:
  postgres:
    image: postgres:16-alpine
    container_name: crop_disease_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crop_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-crop_disease_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crop_user -d crop_disease_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: crop_disease_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      TTS_PROVIDER: ${TTS_PROVIDER:-edge}
      TTS_FALLBACK_PROVIDER: ${TTS_FALLBACK_PROVIDER:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-crop_user}:${POSTGRES_PASSWORD:-crop_secure_password_123}@postgres:5432/${POSTGRES_DB:-crop_disease_db}
      SECRET_KEY: ${SECRET_KEY:-crop_ai_super_secret_production_key_change_in_real_deployment_2026}
      BACKEND_CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:3000", "http://localhost:5173"]'
      UPLOAD_DIR: /app/uploads
      MODEL_PATH: /app/ml/models/efficientnet_b0_plantvillage.onnx
      QUANTIZED_MODEL_PATH: /app/ml/models/efficientnet_b0_plantvillage_int8.onnx
      LABELS_PATH: /app/ml/models/labels.json
      KNOWLEDGE_BASE_PATH: /app/backend/app/knowledge_base/diseases.yaml
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: crop_disease_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: crop_disease_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
  prometheus_data:
